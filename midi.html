<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title is set from the localized catalog on first render; this is only
         what the window chrome shows for the instant before the script runs. -->
    <title>MIDI Control</title>
  </head>
  <body class="midi-window-body">
    <!-- Rebuilt by src/midi-window.ts on every state push, so it always reflects
         the current language, theme, ports and assignments. -->
    <div id="midi-window"></div>
    <script type="module" src="/src/midi-window.ts"></script>
  </body>
</html>
