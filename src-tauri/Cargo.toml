[package]
name = "urx-router"
# App version lives in package.json (tauri.conf.json reads "../package.json");
# this crate is never published, so its version is pinned and not bumped.
version = "0.0.0"
description = "Routing planner for YAMAHA URX series audio interfaces"
license = "MIT"
edition = "2021"
# The template's 1.77 was never a considered floor; tauri-plugin-window-state
# declares 1.77.2, and every build here (CI and both platforms) runs stable.
rust-version = "1.77.2"

[lib]
name = "urx_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decodes the percent-encoded x-file-path IPC header (already in the tree via
# tauri -> url, so this adds no new crate to the build).
percent-encoding = "2"

# Auto-update is desktop-only: the updater downloads and swaps the installed
# bundle, and process restarts the app afterwards. Live hardware control speaks
# the Device Center broker's WebSocket (plain ws://, no TLS) and is likewise
# desktop-only, as is the external MIDI control bridge (midir: CoreMIDI on
# macOS, WinMM on Windows).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tungstenite = "0.30"
midir = "0.11"
tauri-plugin-window-state = "2"

# Power-management bindings for the idle-sleep hold (keepawake.rs). Both are
# already in their platform's tree (core-foundation via midir -> coremidi,
# windows-sys via tokio and muda), so neither adds a crate to the build.
# A file save keeps what was set on the file it replaces (lib.rs
# write_atomic) through libc's copyfile on macOS (libc is already in the tree)
# and ReplaceFileW, windows-sys's FileSystem feature, on Windows.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_System_Threading",
] }

# midir comes from a fork: the released 0.11.0's CoreMIDI input handler slices
# past a packet that ends before its message does and aborts the process
# (Boddlnagg/midir#160). The fork is 0.11.0 plus a bound that ends such a
# message at the packet's end, pinned by commit.
[patch.crates-io]
midir = { git = "https://github.com/semnil/midir", rev = "9c98d83e0657eec7423120557d68d2aabc61d4ae" }
