# Codecov's own configuration. Without this file the service applies its defaults, and the
# one that matters here is `project`: target `auto` (the base commit's coverage) with a
# threshold of 0%, so ANY decrease fails the check.
#
# Four uploads arrive for a commit, all from ci.yml's `coverage` job — `unit` with the
# frontend job's report, and `e2e` with each of the three E2E shards'. Codecov merges them:
# same flag or not, a line reached by any upload is covered, which is what lets the tier
# be split across jobs without the figure moving.
#
# The E2E half is not reproducible to the line: a spec that races a repaint or a
# timeout takes a slightly different path each run, so identical application code can
# post a coverage change of a line or two — enough to read as a drop on a pull request
# that changed one comment and nothing else.
#
# 0.05% sits a few times above that run-to-run spread on CI. Local repeats do not count
# toward it: they measure this machine's timing, not the runner's.
#
# Keep it near the noise floor rather than comfortable. `patch` only ever looks at the
# lines a pull request touched, so `project` is the ONLY status that can see coverage lost
# somewhere the diff never went — a deleted test taking existing lines with it passes
# `patch` by construction. A threshold wide enough to be quiet is also wide enough to let
# that through: 1% would pass a loss twenty times the size 0.05% does.
coverage:
  status:
    project:
      default:
        threshold: 0.05%
    patch:
      default: {}

# The message catalogs, kept out of the merged reading. `ignore` is applied to every
# upload, so it covers the E2E half too — the vitest and monocart filters exclude them as
# well, so that the local table and the uploaded LCOV describe the same set rather than
# two. vitest.config.ts carries the reason.
#
# `ignore` is a top-level key rather than a member of `coverage.status`, so it drops the
# files from the report before EITHER status is computed — `patch` as much as `project`.
# That is the intent: a pull request that adds ja formatters would otherwise be read on
# lines nothing calls, which is the same figure this excludes everywhere else.
#
# This is a one-time INCREASE (the excluded lines were mostly unhit), so the `project`
# status above passes on the commit that lands it; the base commit keeps the number it was
# processed with. Codecov reads each entry as a repo-relative pattern anchored at its start
# (`^src/i18n/en.ts.*` / `^src/i18n/ja.ts.*`), so the pair names those two files and nothing
# else in the tree.
ignore:
  - "src/i18n/en.ts"
  - "src/i18n/ja.ts"

# Codecov posts its statuses once this many uploads have arrived for the commit, rather than
# after each one. The `coverage` job in ci.yml makes every upload, after every job that
# produces a report has finished; scripts/check-merge-gates.mjs holds this number equal to
# that job's uploads and to the reports the jobs it needs produce.
codecov:
  notify:
    after_n_builds: 4
