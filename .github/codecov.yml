# Codecov's own configuration. Without this file the service applies its defaults, and the
# one that matters here is `project`: target `auto` (the base commit's coverage) with a
# threshold of 0%, so ANY decrease fails the check.
#
# Four uploads arrive for a commit — `unit` from the frontend job, and `e2e` from each of
# the three E2E shards. Codecov merges them: same flag or not, a line reached by any upload
# is covered, which is what lets the tier be split across jobs without the figure moving
# (measured on the pull request that split it: 91.39%, -0.01% against its base).
#
# The E2E half is not reproducible to the line: a spec that races a repaint or a
# timeout takes a slightly different path each run. Eleven CI runs over identical
# application code, in two generations of the source, measure that jitter (2026-08-11):
#
#   12669 lines  255e32f 26d3515 cc827ff 95866f1 c6ad594  ->  11173 11173 11172 11173 11174
#   12706 lines  1c14930 726cd78 415eb43 73749c9 d6772c4 7c47838  ->  11612 11613 11612
#                                                                     11612 11613 11612
#
# A spread of TWO lines at its widest, 0.016 points. (Some of those shas are heads a later
# force-push replaced, so they resolve on Codecov rather than in any branch; 415eb43
# changed only files coverage excludes, which is why it belongs in the second row.) That
# jitter is what posted `88.18% (-0.01%) compared to 255e32f` on a pull request that
# changed one comment and nothing else.
#
# 0.05% is about six lines here — a little over three times the widest spread eleven runs
# have shown. The first version of this file said five runs and called the margin unearned;
# the readings above are the ones that were supposed to settle it, and they did not widen
# it. Local repeats still do not count: they measure this machine's timing, not the
# runner's.
#
# Keep it near the noise floor rather than comfortable. `patch` only ever looks at the
# lines a pull request touched, so `project` is the ONLY status that can see coverage lost
# somewhere the diff never went — a deleted test taking existing lines with it passes
# `patch` by construction. A threshold wide enough to be quiet is also wide enough to let
# that through: at 1% it would have been 127 lines.
coverage:
  status:
    project:
      default:
        threshold: 0.05%
    patch:
      default: {}

# The message catalogs, kept out of the merged reading. `ignore` is applied to every
# upload, so it covers the E2E half too — the vitest and monocart filters exclude them as
# well, so that the local table and the uploaded LCOV describe the same set rather than
# two. vitest.config.ts carries the reason.
#
# `ignore` is a top-level key rather than a member of `coverage.status`, so it drops the
# files from the report before EITHER status is computed — `patch` as much as `project`.
# That is the intent: a pull request that adds ja formatters would otherwise be read on
# lines nothing calls, which is the same figure this excludes everywhere else.
#
# This is a one-time INCREASE (the excluded lines were mostly unhit), so the `project`
# status above passes on the commit that lands it; the base commit keeps the number it was
# processed with. Codecov's validator (POST https://codecov.io/validate) answers Valid! and
# expands the two entries to `^src/i18n/en.ts.*` / `^src/i18n/ja.ts.*` — repo-relative and
# anchored, so the pair names those two files and nothing else in the tree.
ignore:
  - "src/i18n/en.ts"
  - "src/i18n/ja.ts"
