name: Install Playwright browsers
description: >
  playwright install --with-deps, under a bound, with the failure named.

# Why this exists rather than a bare `run:`.
#
# `--with-deps` is two operations, and only one of them is the browser. First it runs
# `apt-get update` plus `apt-get install` of the browser's system libraries — measured
# at 29 packages / 32 MB for chromium and **201 packages / 125 MB for webkit**, fetched
# one .deb at a time from the runner's Ubuntu mirror. Only then does it download the
# browser build. Normal cost: 22-26 s for chromium, 33-44 s for webkit.
#
# Those figures are as measured when this action was written (2026-08-06), and they are
# written here and in no other file. Both lists move with the browser build and with the
# runner image, so what carries over is the ratio, not the count — and a second copy of a
# moving number is a contradiction waiting to be found: ci.yml and race.yml each carried
# one, and they disagreed about chromium (36 against 29) within the day.
#
# On 2026-08-05 that mirror degraded for a quarter of an hour. Individual .deb fetches
# stalled 22, 30, 44, 62, 90, 93 and 157 s; the webkit job reached package 182 of 201
# and was killed by its own 15-minute job timeout, so the tests never started. The three
# chromium jobs in the same run finished in 22-26 s — the degradation scaled with the
# number of requests, not with reachability.
#
# What that cost was not the runner minutes. It was a release PR carrying a red check
# that said only "cancelled", with the reason 600 lines into a log the API will not
# serve while the run is still going. Bounded, the step fails at a known time and says
# what stalled, which is the whole of the difference.
#
# Deliberately NOT retried. `timeout` signals the process it started — pnpm — and apt
# runs under sudo as a grandchild, so it survives and keeps `/var/lib/dpkg/lock`. A
# second attempt would fail on the lock rather than on the mirror, turning one clear
# failure into a confusing one. Re-running the job is a click and gets a clean VM, and
# a 15-minute degradation would not have been ridden out by a retry anyway.
#
# The one home for every external fetch's readings.
#
# The same attribution argument puts a step bound on every other step that fetches from a
# host outside GitHub, and the durations behind those bounds are written here and in no
# other file: each such step carries a bare `timeout-minutes` whose comment points at this
# header. Every bound is a hang detector inside its job's own budget, and every one but
# pnpm/action-setup's (below the table) is several times the slowest successful run of its
# step.
#
# The readings are GitHub's own step timings for the last completed runs of each workflow:
# ci.yml 33867471824-36715253011 (300 runs), race.yml 34580218248-36714307969 (120),
# format.yml 34578996323-36714308006 (120), post-merge.yml 33853025493-36715253366 (73),
# pages.yml 29575646143-36718216146 (39) and release.yml 29674297590-36716230166 (40).
# Successful steps only, in seconds; a range is the spread across the platforms the step
# runs on, and the run named is the slowest one's.
#
#   step                                 fetches from               median   slowest (run)      bound
#   pnpm/action-setup                    registry.npmjs.org         4-20     313 (33870176139)  10 min
#   pnpm install                         registry.npmjs.org         1-2      23 (30270005336)   10 min
#   dtolnay/rust-toolchain               static.rust-lang.org       1-7      41 (31840214550)   5 min
#   taiki-e/cache-cargo-install-action   crates.io, on a cache miss 1        135 (36281855474)  10 min
#   cargo about generate                 crates.io                  60       70 (34674781972)   10 min
#   cargo test                           crates.io, on a cache miss 21       54 (36445916228)   15 min
#   cargo build --release                crates.io, on a cache miss 71-126   258 (34516796080)  20 min
#   tauri-apps/tauri-action              crates.io; Apple's notary  160-162  378 (30153131483)  30 min
#   codecov/codecov-action               cli.codecov.io, codecov.io 3        33 (34644529460)   5 min
#
# Every pnpm/action-setup step over 150 s — 15 of its 2517 successful ones — falls in one
# stretch of six runs (33853025493-33870176139), on all three platforms, up to 313 s, and
# each of them finished; outside that stretch its slowest was 86 s (34084200901). Its
# 10-minute bound is about twice that stretch's slowest rather than several times 86 s, so a
# run that slow still passes.
#
# This action's own calls carry a 10-minute step bound, above its `timeout` input (300 s by
# default), so the failure the script below names is the one that fires. `pnpm check:gates`
# fails a step that uses an action in the table, or this one, or runs a command in it, with
# no `timeout-minutes` of its own, and refuses an action it classifies neither as such a fetch
# nor as one of the GitHub-only ones below (scripts/check-merge-gates.mjs).
#
# Not bounded, because what they fetch is GitHub's: actions/setup-node (Node from the
# runner's tool cache, which a job container mounts too, and the pnpm store from GitHub's
# cache service), swatinem/rust-cache (GitHub's cache service), and the artifact and Pages
# actions.
#
# A job's `container:` image (mcr.microsoft.com) is pulled in the runner's "Initialize
# containers" phase, before any step exists, so no step bound can reach it: the job's own
# `timeout-minutes` is what stops a stalled pull, and that phase's log is where it shows.
# Its timings over 1580 pulls in ci.yml and race.yml: median 27 s, slowest 59 s
# (35786445982).

inputs:
  browser:
    description: Which browser to install (chromium / firefox / webkit).
    required: true
  with-deps:
    description: >
      Install the system libraries too. False inside the official Playwright container,
      which already carries them — there the install is a no-op that prints "browser is
      already installed", and it is kept rather than dropped so an image whose browser
      revision does not match the lockfile heals itself instead of failing at launch.
    required: false
    default: "true"
  timeout:
    description: >
      Seconds to allow. The default is roughly seven times the slowest normal run, so
      it absorbs an ordinary bad day and still fails well inside a job's budget.
    required: false
    default: "300"

runs:
  using: composite
  steps:
    - shell: bash
      # The two values travel in the environment rather than being interpolated into
      # the script. They are literals in the calling workflow today, and the habit is
      # what keeps that true when someone later wires an input to an event field.
      env:
        BROWSER: ${{ inputs.browser }}
        TIMEOUT: ${{ inputs.timeout }}
        WITH_DEPS: ${{ inputs.with-deps }}
      run: |
        set -uo pipefail
        # An `if`, not `[ … ] && deps=…`. GitHub runs `shell: bash` with -e, and a false
        # `&&` list exits the script when it happens to be the last command — so the
        # short form works here and becomes a failure the day a line is added after it.
        deps=""
        if [ "${WITH_DEPS}" = "true" ]; then deps="--with-deps"; fi
        # Captured on the command itself, not after an `if`. After a false `if` with no
        # `else`, `$?` is the if statement's own status — zero — so the 124 test below
        # would never have fired and every timeout would have reported as a generic
        # failure. Measured, not remembered.
        status=0
        timeout "${TIMEOUT}" pnpm exec playwright install ${deps} "${BROWSER}" || status=$?
        if [ "${status}" -eq 0 ]; then
          exit 0
        fi
        if [ "${status}" -eq 124 ]; then
          echo "::error title=Playwright browser install timed out::playwright install --with-deps ${BROWSER} exceeded ${TIMEOUT} s. Its first half fetches the browser's system libraries one .deb at a time from the runner's Ubuntu mirror, and webkit's list is far the longer of the two; a degraded mirror is what this bound exists to catch. Re-run the job — it gets a fresh VM. If it recurs, the log's 'Get:' lines carry the per-package timings."
        else
          echo "::error title=Playwright browser install failed::playwright install --with-deps ${BROWSER} exited ${status}."
        fi
        exit 1
