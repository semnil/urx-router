name: Race harness

# The live-sync race-diagnosis harness (e2e/race; design in
# docs/{en,ja}/live-race-harness.md), split out of the ordinary E2E tier because it takes
# the great majority of that tier's machine time on its own. The measurement that cut the
# boundary is in that document ("Where each tier runs") and stated nowhere else — a copy
# in a comment is exactly what went stale elsewhere in this repository. That cost is what
# is being measured rather than overhead — several cases provoke whole-device readbacks of
# ~800 sequential commands — so it stays its own workflow rather than being folded into
# the ordinary tier.
#
# It runs on every pull request EXCEPT one whose diff is documentation alone, and on the
# one that changes the app version. The first clause is written as an exclusion because
# three successive attempts to write it as a watch list each left a real dependency out —
# the list, the leaks and what each cost are beside the `case` in `detect`. What the
# harness reads reaches well past `e2e/race/`: its specs, the config that declares its two
# projects, the bundle it serves, the server that serves it, the lockfile that pins the
# browser, and this file. Documentation is the one class that provably reaches none of it.
#
# The second clause no longer decides any pull request on its own — a version bump edits
# `package.json`, which is not documentation — so `detect` evaluates and prints both rather
# than returning on the first; see the note above the final `if`. It is kept because it is
# the written statement that the harness stands in front of the only commit a user ever
# installs, and because it is what survives anyone narrowing the first clause. In front of
# the tag rather than behind it, where a red result would arrive after the tag exists.
#
# The cost is taken deliberately and measured: Dependabot's npm ecosystem runs weekly and
# every one of its pull requests now spends a harness run. The frequency, against the two
# narrower rules this replaced, is in docs/{en,ja}/live-race-harness.md.
#
# `paths-ignore:` on the trigger would express the first clause and nothing else, and it
# would express it in the one place that breaks the merge gate: a workflow skipped by a
# trigger filter reports no check run at all, leaving `race-required` at "Expected"
# forever. So the trigger carries no filter, `detect` runs on every pull request and
# decides there, and on a documentation-only one the two harness jobs skip on their own
# condition, which reports success in seconds.
#
# Also runnable on demand against any branch:
#
#   gh workflow run race.yml --ref <branch>
on:
  pull_request:
  workflow_dispatch:

# Pushing again to a pull request abandons the run already in flight. This is the
# expensive tier and it now runs on ordinary pull requests, so a review carrying several
# pushes would otherwise pay for it once per push.
#
# Every run that is not a pull-request run is a group of ONE:
# `github.event.pull_request.number` is empty on those, so the key falls to
# `github.run_id` and they cancel nothing. A `workflow_dispatch` on a branch reports
# `race-required` on the same head commit a pull-request run does, and a cancelled run
# leaves that check at `cancelled` — not one of the statuses that satisfy a required check
# (`success`, `skipped`, `neutral`), so the merge is blocked until something re-reports.
# `cancel-in-progress: false` is not an alternative here: `concurrency.queue` defaults to
# `single`, which replaces a pending run in a shared group, and `queue: max` cannot be
# combined with `cancel-in-progress: true`.
concurrency:
  group: race-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # A cheap gate in front of the harness jobs. A manual dispatch always runs: there is no
  # base to compare against, and asking for it IS the intent.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      playwright: ${{ steps.pw.outputs.version }}
      weights: ${{ steps.weights.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit has to be in the local history for the diff and the `git show`
          # below to read anything out of it.
          fetch-depth: 0
      - id: check
        # The SHA travels in the environment rather than inline: the value here is a hex
        # commit id, but interpolating event payload straight into a shell is the habit
        # that goes wrong the first time the field carries text somebody else authored.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `git diff` rather than the API's file list. This job already has the whole
          # history for the version read below, and both endpoints ci.yml has to use
          # instead truncate without saying so (that job carries the ceilings and the
          # guards against them). A diff against the base has no ceiling to guard.
          #
          # Two flags, each measured in a scratch repository, and since the question
          # became an exclusion they no longer guard the same direction.
          #
          # `--no-renames` is the one that still stops a silent skip: rename detection
          # prints a moved file at its DESTINATION alone, so moving a module into docs/
          # would print one documentation path and the whole diff would read as
          # documentation-only. `-z` now fails the other way — git C-quotes any path it
          # cannot print literally (a non-ASCII byte, but also a `"`, a backslash or a
          # control byte), and a quoted path matches neither `docs/*` nor `*.md`, so it
          # reads as code and the harness runs. It is kept so the `case` below tests real
          # paths rather than a rendering of them; measured, `core.quotePath=false` covers
          # only the non-ASCII third of the quoting and `-z` does not imply --no-renames.
          # It costs a file, since a NUL cannot survive a shell variable.
          list=$(mktemp)
          if ! git diff --name-only --no-renames -z "${BASE_SHA}" HEAD > "${list}"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "could not diff against ${BASE_SHA} — running the harness rather than guessing"
            exit 0
          fi
          # A shell loop, which is the shape ci.yml's preflight already uses over its own
          # file list, rather than `printf | grep -q`. That pipeline reads a match
          # correctly under the bare `run:` default (errexit, no pipefail) but folds two
          # other statuses into "no match": grep's exit 2, and a SIGPIPE on printf once
          # `grep -q` has exited early — measured, the latter turns an 8000-path diff into
          # `run=false` the moment a step declares `shell: bash`, which adds pipefail.
          # Both fold toward not running, which is the direction this whole job is
          # written against.
          #
          # An EXCLUSION, not a list of what to watch: everything runs the harness unless
          # every changed file is documentation. Same rule, same order, same exception as
          # ci.yml's preflight — the generated model references are Markdown that
          # skill-export.test.ts diffs, so they are code here too.
          #
          # A watch list was tried first and leaked three times in one sitting: it named
          # neither e2e/graph-helpers.ts (which the harness's own specs import) nor
          # playwright.config.ts (where its two projects are declared), then not
          # pnpm-lock.yaml (which decides the container image both harness jobs run in),
          # then not this workflow, .github/actions/install-browsers, .env.trace,
          # vite.config.ts or scripts/e2e-serve.mjs. Each leak was a pull request that
          # could break the harness while race-required stayed green. The failure mode of
          # a list is a dependency nobody added to it; the failure mode of this is a run
          # nobody needed.
          touched=false
          while IFS= read -r -d '' file; do
            case "${file}" in
              .claude/skills/urx-routing-planner/references/model-*.md) touched=true ;;
              docs/* | *.md) ;;
              *) touched=true ;;
            esac
          done < "${list}"
          head=$(jq -r .version package.json)
          # Read in two steps, not one pipeline: a pipeline's status is its LAST
          # command's, so `git show ... | jq` returns an empty string and exit 0 when git
          # fails. Empty compares unequal to every version, so the skip would quietly
          # become "always run" — the cheap direction to be wrong in, but not one to
          # arrive at by accident. Say so and run.
          if ! base_json=$(git show "${BASE_SHA}:package.json"); then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "could not read package.json at ${BASE_SHA} — running the harness rather than guessing"
            exit 0
          fi
          base=$(printf '%s' "${base_json}" | jq -r .version)
          # `jq -r` prints the string "null" and exits 0 for a key that is not there, so a
          # package.json that lost its version would compare equal to itself and skip.
          # tag-release.yml carries the same guard over the same field and refuses; the
          # safe answer here is the other one, which is to run.
          if [[ -z "${base}" || "${base}" == 'null' || -z "${head}" || "${head}" == 'null' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'could not read a version on one side — running the harness rather than guessing'
            exit 0
          fi
          moved=false
          if [[ "${base}" != "${head}" ]]; then
            moved=true
          fi
          # Both clauses are evaluated and both are printed, rather than the first one
          # winning and returning. A version bump edits package.json, which is not
          # documentation, so the exclusion above already answers that pull request and an
          # early return would have left the version comparison with no path to it — code
          # a reader would still take for the thing that keeps the harness in front of a
          # release. It is kept because it is that statement, and it is the clause that
          # survives anyone narrowing the exclusion.
          echo "beyond documentation: ${touched} | version: ${base} (base) -> ${head} (head), moved: ${moved}"
          if [[ "${touched}" == 'true' || "${moved}" == 'true' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'running the harness'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'documentation only and the version did not move — the harness is skipped'
          fi
      # Both harness jobs run inside the official Playwright image; the tag comes from
      # here. See .github/actions/playwright-version for why it is a job's output.
      - id: pw
        uses: ./.github/actions/playwright-version
      # How the shards are sized, read from the one file that holds it — the same ledger
      # `pnpm check:skips` validates it against. Playwright's own split takes a contiguous
      # slice of the collected order sized by case COUNT, which on this tier is not the same
      # as by time: the six t2*-shape-change files are adjacent in path order, so the shard
      # that inherits them carried 12.3 minutes against another's 4.5, over case counts of
      # 57 / 57 / 56. `PWTEST_SHARD_WEIGHTS` cuts the same order by measured duration instead.
      #
      # `-e`, because the failure to guard against is the quiet one: jq prints nothing and
      # exits 0 for a key that is not there, an empty variable is not a parse error to
      # Playwright but a fall back to the equal split, and the run would then be slow rather
      # than red. The assignment's own status is the command's, so errexit ends the job here.
      - id: weights
        run: |
          weights=$(jq -er '.collect.shardWeights | join(":")' e2e/race/skip-ledger.json)
          echo "value=${weights}" >> "$GITHUB_OUTPUT"
          echo "shard weights: ${weights}"

  race:
    needs: detect
    if: needs.detect.outputs.run != 'false'
    runs-on: ubuntu-latest
    # Same image as the WebKit job below, for the same reason and at the same measured
    # cost — see that job's header. The shards' own exposure is the smaller one (36
    # sequential .deb fetches against WebKit's 201, and the three of them were unharmed
    # by the degradation that killed WebKit), so what settles it here is that a run of
    # this workflow sits in front of a merge — and on the version-bump PR, in front of a
    # release. One environment for all four jobs also means the workflow states one rule
    # rather than two.
    container: mcr.microsoft.com/playwright:v${{ needs.detect.outputs.playwright }}-noble
    # Several times what the slowest shard takes — and it is the SLOWEST that has to fit,
    # which the weights below level out rather than remove (docs/{en,ja}/live-race-harness.md
    # carries that reading, and every other figure about this tier). Left where it was when
    # one shard ran three times another: this is a backstop against a wedged run holding a
    # runner for the 6-hour job default, not a budget, and a re-balancing is no reason to
    # narrow it.
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      # A second shard's result is not implied by the first one's, and a partial picture
      # is what sends someone back for another full run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10 # hang detector, not a budget — see .github/actions/install-browsers
      # Already in the image; kept as the self-healing no-op described in the action.
      - uses: ./.github/actions/install-browsers
        with:
          browser: chromium
          with-deps: "false"
      # No `--` before the flag: pnpm 10 forwards the separator through to the script
      # rather than consuming it, and Playwright reads everything after a `--` as a
      # positional file filter. `pnpm test:e2e:race -- --shard=1/3` therefore runs the
      # WHOLE harness in every shard and still passes — three times the cost, silently.
      #
      # The total comes from `strategy.job-total` (the idiom ci.yml's E2E tier already uses)
      # so the matrix is the only place the shard count is written on this side. The other
      # place is the length of the weights array `detect` read, and the two disagreeing is
      # not a silent skew: Playwright refuses a weight list that does not match the total.
      - run: pnpm test:e2e:race --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          PWTEST_SHARD_WEIGHTS: ${{ needs.detect.outputs.weights }}
      # The "list" reporter writes no playwright-report/; traces (trace: on-first-retry,
      # with the project's one CI retry) and failure attachments land in the default
      # test-results/, so that is what a failing run has to upload. The name carries the
      # shard: from v4 on an artifact name can be uploaded once per run, so three shards
      # sharing one name fails the upload instead of merging into it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: race-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The cases tagged @webkit, in the engine the macOS build actually renders in. Its own
  # job rather than a fourth shard: WebKit is a separate download, and paying for it in
  # all three shards would cost more than this handful of cases does — the figures are in
  # docs/{en,ja}/live-race-harness.md, not here.
  race-webkit:
    needs: detect
    if: needs.detect.outputs.run != 'false'
    runs-on: ubuntu-latest
    # The one job in this repository that does not build its environment out of the
    # Ubuntu mirror. `--with-deps webkit` fetches an order of magnitude more .debs than
    # chromium, one at a time, and on 2026-08-05 a degraded mirror stalled it past this
    # job's whole budget: it was killed with the package list unfinished, tests never
    # started, and the release PR carried a check that said only "cancelled". The image
    # carries those libraries and the browsers already, and pulling it costs about what
    # the apt path costs on a good day — so this is not a trade of speed for reliability,
    # and it replaces a long run of sequential requests with a handful of blobs from a
    # different host. The dated measurements are in .github/actions/install-browsers,
    # which is the only place any of these counts and timings are written down.
    #
    # The tag comes from `detect`, which reads the version the lockfile resolves. Pinning
    # it here by hand would drift the first time Dependabot bumps Playwright, and the
    # symptom of that drift is a browser build the installed Playwright does not drive.
    container: mcr.microsoft.com/playwright:v${{ needs.detect.outputs.playwright }}-noble
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10 # hang detector, not a budget — see .github/actions/install-browsers
      # Kept rather than dropped, and without the deps: inside the image this prints
      # "browser is already installed" and costs a second, but an image whose browser
      # revision does not match the lockfile heals itself here instead of failing at
      # launch with a path that does not exist.
      - uses: ./.github/actions/install-browsers
        with:
          browser: webkit
          with-deps: "false"
      - run: pnpm test:e2e:race:webkit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: race-traces-webkit
          path: test-results/
          retention-days: 7

  # The single context this workflow contributes to the branch ruleset
  # (.github/required-checks.json). On a pull request that touches neither trigger path
  # nor the version it is a few seconds of green over two skipped jobs — `detect` runs,
  # and `race` and `race-webkit` skip on their own condition, `race` as ONE job because a
  # matrix whose job-level `if:` is false is never expanded. Everywhere else it is what
  # stops the merge, and on the version-bump PR what stops a release from being tagged
  # over a red harness.
  #
  # Because the skip and the pass report the same colour, this context alone does not say
  # WHICH of the two happened. `detect`'s log does, and it prints the reason on both
  # sides.
  #
  # `always()` and an explicit read of the results, because a job skipped by a failed
  # dependency reports SUCCESS to a required check: with a bare `needs:` this gate would
  # be skipped the same way and the ruleset would read a red harness as green. The three
  # shards arrive here as one result, which is 'failure' if any of them failed.
  race-required:
    needs: [detect, race, race-webkit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed or skipped by design
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        # Named one by one rather than joined: `needs.*.result` is a bare list of results
        # whose order is not this file's to promise, and a message that pairs the wrong
        # job with the wrong verdict sends the reader to the wrong log.
        env:
          DETECT: ${{ needs.detect.result }}
          RACE: ${{ needs.race.result }}
          # Bracketed, not dotted: a hyphen is not a legal character in an expression's
          # property path, and `needs.race-webkit.result` parses as a subtraction.
          RACE_WEBKIT: ${{ needs['race-webkit'].result }}
        run: |
          echo "::error::the race harness did not pass — detect=${DETECT} race=${RACE} race-webkit=${RACE_WEBKIT}"
          exit 1
