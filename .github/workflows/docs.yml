name: Docs

# The document-structure checks, and the "## Reusable assets" index in both directions.
# ci.yml's expensive jobs skip a doc-only change, so this is where documentation is
# verified instead. Runs on external PRs too, which the local Claude Code hook cannot
# cover.
#
# No trigger filter, and no condition on the job: this workflow reports `docs-required`,
# one of the contexts the branch ruleset makes a merge condition, and a required check
# only reports at all when its workflow runs. Filtering it to Markdown would leave every
# code-only pull request waiting for a check that never arrives. Nothing here is
# path-dependent anyway — both checkers read the whole tree — and the job costs seconds:
# no pnpm install, no build.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Seconds either way, so this buys little on its own; it is here so that every workflow
# states what it does under a second push rather than leaving one to read as an oversight.
# The key's shape is race.yml's, and `github.run_id` keeps push runs in a group of one for
# the reason ci.yml gives.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  docs-required:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/check-md-tables.mjs
      # Both halves of the "## Reusable assets" index: a row that points at nothing or an
      # asset that reached the repo without reaching the table, plus every file reference
      # docs/{en,ja} makes, in a code span or in a sentence. The same script also ran in
      # ci.yml, which was only needed while this workflow was Markdown-filtered and could
      # not see a moved file the documents still name; now that it runs on every change,
      # that second copy would report the same findings twice. Zero-dep on purpose — this
      # job has no pnpm install.
      - run: node scripts/check-assets-index.mjs
      # The workflows themselves: every context the ruleset requires still has a job that
      # reports it on every pull request. ci.yml's `preflight` runs this too, so a change
      # that breaks ci.yml's own trigger is still caught here.
      - run: node scripts/check-merge-gates.mjs
      # Comments that record where a fact came from rather than what the code does. The
      # ledger beside the script holds a per-file ceiling for the backlog that predates the
      # rule, so this job is red only for a NEW one. Zero-dep, like its neighbours.
      - run: node scripts/check-comment-provenance.mjs
      # The assumptions field, held to what it is for. An item naming none of the three
      # external dependencies is an observation this side could take, and the body stops
      # being visible the moment it merges — so the field has to be answered rather than
      # used to defer. Only on a pull request, since a push carries no body, and the body
      # reaches the script through the environment rather than the command line: it is
      # text a contributor wrote, and a `run:` interpolating it would run it.
      - if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-assumptions.mjs
