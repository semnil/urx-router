name: Deploy demo to GitHub Pages

# Builds the browser demo (file persistence and image export hidden via
# VITE_DEMO) and publishes it to GitHub Pages when a release IS PUBLISHED — not
# when its tag is cut. The installers land in a draft Release that a human reads
# before it goes out; this puts the demo behind the same gesture, so the two stop
# describing different versions for however long that review takes.
#
# `release: published` fires when a draft becomes public, and nothing fires when
# the draft is created, which is exactly the shape wanted. **It works because a
# person publishes it.** A draft published from a workflow using the repository's
# GITHUB_TOKEN would fire nothing at all — the same rule that stops an auto-pushed
# tag from starting release.yml, which is why tag-release.yml has to dispatch that
# one. Here the symptom would not be a failed run but NO run, and the demo would
# quietly stop tracking releases. Automating the publish means giving this workflow
# an explicit dispatch (or the publisher a PAT) in the same change.
#
# The event runs on the release's tag, so the build is the released code. The
# checkout says which ref out loud rather than resting on that reading; the
# expression is empty on a manual dispatch, where checkout falls back to the ref
# the dispatch named. The `github-pages` environment admits both (`main`, `v*`).
#
# There is no `push: tags:` trigger any more. There was one, and it had not fired
# since v1.5.1 — the tag is created with GITHUB_TOKEN, so it never reached it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The released commit, named rather than inferred. Empty on a manual
          # dispatch, where checkout falls back to the dispatched ref. Creating a
          # release needs write access, so this field is not an outside input the
          # way a fork's head ref would be.
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10 # hang detector, not a budget — see .github/actions/install-browsers
      - run: pnpm build:demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
