name: Post-merge

# Heavier jobs that run only after a change lands on main, to keep PR feedback
# fast. The frontend build/unit gate and the ordinary E2E suite both run per-PR in
# ci.yml; the live-sync race harness runs from race.yml, whose own header says when.
# What each tier costs is measured once in docs/{en,ja}/live-race-harness.md ("Where
# each tier runs") and is not restated here, because the copy that used to sit in this
# comment had drifted against it.
# Doc-only changes don't affect the dependency license set or the Rust build.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

# Keyed by the branch, so merges landing in quick succession leave only the newest run.
# Nothing waits on this workflow — tag-release.yml watches CI, not this — so a cancelled
# run costs that commit its license gate and its cache warm, both of which the next merge
# performs on a tree that contains the cancelled commit's changes.
concurrency:
  group: post-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    uses: ./.github/workflows/licenses.yml

  # Populates the platform Rust caches on the default branch. A release runs on
  # a tag ref, and a run can only restore caches from its own ref or the default
  # branch — caches a tag run writes are unreachable from the next tag, so
  # without this every release compiles the whole dependency tree from scratch.
  # Builds the binary only (no bundling or signing). Runs on every merge rather
  # than on src-tauri changes alone: a restore refreshes the cache's eviction
  # clock, and a tag can follow any merge. A miss is silent — it only shows up
  # as a slow release — so the matrix, each entry's cacheKey included, has to
  # stay identical to release.yml's build job.
  warm-cache:
    strategy:
      fail-fast: false
      matrix:
        include:
          # cacheKey is the rust-cache shared-key. macOS has its own because its cache is
          # filled by the Tauri CLI build below rather than by plain cargo, and rust-cache
          # saves nothing after a restore that matched its key exactly: under the key a
          # cargo-only build filled, that cache is restored as a full match and kept as it
          # is, so the Tauri CLI build's result is never saved.
          - platform: macos-26
            args: --target aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin
            cacheKey: release-tauri
          - platform: windows-latest
            args: ''
            rustTargets: ''
            cacheKey: release
    runs-on: ${{ matrix.platform }}
    # A cold Rust build is what this job is FOR, so the bound is generous: 5.1 minutes
    # is the slowest of sixteen recent runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 10 # hang detector, not a budget — see .github/actions/install-browsers
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        timeout-minutes: 5 # hang detector, not a budget — see .github/actions/install-browsers
        with:
          toolchain: stable
          targets: ${{ matrix.rustTargets }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.cacheKey }}
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10 # hang detector, not a budget — see .github/actions/install-browsers
      # tauri-build reads the frontend output and copies bundle.resources at
      # compile time, so both have to exist. This job never bundles, so the
      # notice is a placeholder rather than the generated one.
      - run: pnpm build
      - run: echo "" > src-tauri/THIRD_PARTY_LICENSES.html
      # macOS builds through the Tauri CLI, as release.yml's tauri-action does: the CLI
      # exports MACOSX_DEPLOYMENT_TARGET from bundle.macOS.minimumSystemVersion, and the
      # build scripts of objc2, objc2-exception-helper and ring rerun when that variable
      # changes, so a cache built without it is rebuilt from those crates up at release
      # time. --no-bundle stops after the compile, so nothing is bundled or signed.
      - if: runner.os == 'macOS'
        run: pnpm tauri build --no-bundle ${{ matrix.args }}
        timeout-minutes: 20 # hang detector, not a budget — see .github/actions/install-browsers
      - if: runner.os != 'macOS'
        run: cargo build --release ${{ matrix.args }}
        working-directory: src-tauri
        timeout-minutes: 20 # hang detector, not a budget — see .github/actions/install-browsers
