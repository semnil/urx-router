name: CI

# Lightweight checks on every PR and on pushes to main: the build, the unit tests and
# the ordinary E2E suite. Third-party license generation runs post-merge (post-merge.yml)
# and the live-sync race harness is race.yml's, which decides for itself which pull
# requests it runs on.
# Doc-only changes (Markdown, docs/) don't affect the build or tests, so the expensive
# jobs skip them — except the skill's generated model references, which
# skill-export.test.ts diffs against the generator, so an .md-only edit there
# must still run the unit tests.
#
# That skip lives on the JOBS, and the trigger carries no `paths` at all. The difference
# is not stylistic: a workflow skipped by a trigger filter reports no check run, so a
# required status check it carries waits forever and the pull request can never merge,
# while a job skipped by `if:` reports success. `preflight` decides the scope once and
# every expensive job carries the same condition; `ci-required` is the one context this
# workflow contributes to the ruleset. scripts/check-merge-gates.mjs is what keeps that
# arrangement true — it runs in `preflight`, the one job here with no condition.
on:
  pull_request:
  push:
    branches: [main]

# Pushing again to a pull request abandons the run already in flight. The key's shape is
# race.yml's; what is specific here is the other half of the trigger.
#
# A push to main is a group of ONE: `github.event.pull_request.number` is empty off a pull
# request, so a push run keys on `github.run_id` and joins nothing. It has to.
# tag-release.yml reads this workflow's conclusion on main, so a main run dropped from a
# shared group can leave a version bump untagged, with nothing red to read. Most main runs
# carry no bump and tag-release ends on its own; the one that does is the whole release.
# `cancel-in-progress: false` is not an alternative here: `concurrency.queue` defaults to
# `single`, which replaces a pending run in a shared group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The path filter, moved off the trigger. Cheap enough to sit in front of everything:
  # no install, no build, and the file list comes from the API rather than from a diff,
  # so nothing here needs history.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      version: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Zero-dep on purpose — this job has no pnpm install. Every context the branch
      # ruleset requires still has a job that reports it on every pull request.
      - run: node scripts/check-merge-gates.mjs
      # The image tag the E2E job's `container:` needs. It rides here rather than in a job
      # of its own because `container:` is evaluated before any step of its own job, so the
      # value has to come from a PRIOR job either way — and this one is already prior to
      # everything, already checked out, and already running node. Its own job cost a
      # second dispatch and about six seconds on the critical path of every pull request,
      # which is the whole of what it did. See .github/actions/playwright-version for why
      # the tag is read from the lockfile at all.
      #
      # Unconditional, including on the doc-only pull requests where the E2E job does not
      # run: the whole step is one lockfile read, and a step skipped by `if:` publishes an
      # EMPTY output — which reaches `container:` as a tag that does not exist rather than
      # as a job that does not run.
      - id: pw
        uses: ./.github/actions/playwright-version
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        # A pull request's file list is the same one GitHub's own path filter reads. Every
        # way of failing to read it runs the full suite instead: an unreadable list must
        # not be able to turn the skip into "nothing to do", which is the direction that
        # ships untested code. race.yml's `detect` takes the same side for the same reason.
        #
        # A TRUNCATED list is the same hazard wearing a valid response. Both endpoints have
        # a ceiling and neither says it hit one: the pull request's files stop at 3000
        # however far you paginate, and compare carries "up to 300 changed files for the
        # entire comparison" on its first page only, so paging does not extend that one.
        # A list cut off above the ceiling whose visible part happens to be all
        # documentation would skip the build and the tests with `ci-required` still green.
        # The count is the only tell the response carries, and the pull request has a
        # second, exact one: `changed_files` on the PR itself, which is not the same query.
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            ceiling=3000
            files=$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" -q '.[].filename') || files=''
            declared=$(gh api "repos/${REPO}/pulls/${PR}" -q '.changed_files') || declared=''
          else
            ceiling=300
            files=$(gh api "repos/${REPO}/compare/${BEFORE}...${AFTER}" -q '.files[].filename') || files=''
            declared=''
          fi
          if [[ -z "${files}" ]]; then
            echo 'could not read the changed files — running everything rather than guessing'
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(printf '%s\n' "${files}" | wc -l | tr -d ' ')
          if (( count >= ceiling )); then
            echo "the file list reached the endpoint's ${ceiling}-file ceiling — it may be cut off, running everything"
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${declared}" && "${declared}" != "${count}" ]]; then
            echo "the pull request declares ${declared} changed files and the list carried ${count} — running everything"
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${files}"
          code=false
          while IFS= read -r file; do
            case "${file}" in
              # Generated from src/models/, and skill-export.test.ts diffs it against the
              # generator, so this .md is code as far as the unit tests are concerned.
              .claude/skills/urx-routing-planner/references/model-*.md) code=true ;;
              docs/*|*.md) ;;
              *) code=true ;;
            esac
          done <<< "${files}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "code=${code}"

  frontend:
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10 # hang detector, not a budget — see .github/actions/install-browsers
      - run: pnpm build
      # Four handles are build-gated. Three are dev-only (import.meta.env.DEV): the meter
      # bench's console handle (src/ui/console.ts), the keyboard measurement harness
      # (src/ui/keyprobe.ts, installed from src/main.ts) and the MIDI timing buffer
      # (src/ui/midi-probe.ts, installed from src/ui/midi.ts). The fourth, the race
      # harness's plan-ledger probe (src/ui/trace-probe.ts), rides its own build flag
      # (VITE_TRACE, .env.trace) so the instrumented E2E tier can be served a
      # production-SHAPED bundle rather than a dev one. A plain build drops all four
      # statically; this is the guard that they stay dropped. Emitted code only — the
      # source map carries the original text of the dropped branch by design. The other
      # half of each contract — that the handle still carries what its driver uses — is
      # pinned in src/ui/meter-bench.contract.test.ts, src/ui/keyprobe.test.ts and
      # src/ui/midi-probe.test.ts.
      - name: Dev-only hooks stay out of the bundle
        # `! grep ...` per line does not work here: POSIX errexit is ignored for a
        # pipeline beginning with `!`, so under the default `bash -e` only the LAST
        # line's status became the step's status and an earlier leak passed silently.
        # An explicit if/exit per handle fails on whichever line actually matches.
        run: |
          if grep -rl --include='*.js' --include='*.html' "__urxConsole" dist; then echo "__urxConsole leaked into the bundle"; exit 1; fi
          if grep -rl --include='*.js' --include='*.html' "__urxKeyProbe" dist; then echo "__urxKeyProbe leaked into the bundle"; exit 1; fi
          if grep -rl --include='*.js' --include='*.html' "__urxTrace" dist; then echo "__urxTrace leaked into the bundle"; exit 1; fi
          if grep -rl --include='*.js' --include='*.html' "__urxMidiProbe" dist; then echo "__urxMidiProbe leaked into the bundle"; exit 1; fi
      - run: pnpm typecheck:e2e
      # The harness's permanent skips: each is registered with the test that keeps its
      # reason true, or with a statement that nothing does. It asks both runners what they
      # collect rather than reading the specs, so it needs the install this job already
      # has — docs.yml, where the other three checks live, deliberately has none. Nothing
      # is lost by not running it there: a Markdown/docs-only change, which is what this
      # workflow skips, cannot move a spec or a guarantor. Beside the race tier itself it
      # would report on a smaller set of pull requests, since that tier's trigger skips one
      # whose diff touches neither src/ nor e2e/race/ nor the version.
      - run: pnpm check:skips
      - run: pnpm test:coverage
      - name: Upload frontend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          fail_ci_if_error: false
          files: ./coverage/lcov.info
          flags: unit
          name: frontend-unit
          use_oidc: true

  # The Rust half had no gate at all: `cargo fmt` runs in format.yml, the platform build
  # runs post-merge, and `cargo test` ran in neither — so nothing on a pull request
  # compiled `src-tauri` at all, and `#[cfg(test)]` is not compiled by `cargo check`
  # either. What the tests there pin is shell behaviour with no other net: the launch-flag
  # latch, the ledger's rotation, the worker's connection generations, and which webview's
  # page load may tear the app's device session and MIDI ports down.
  #
  # macOS rather than ubuntu, which would be the cheaper runner: this crate is only ever
  # built on macos-26 and windows-latest, and a Linux build needs libwebkit2gtk installed
  # from the Ubuntu mirror — the sequential apt path #257 took out of every E2E run, and
  # a platform nothing else here compiles on. Free either way on a public repository.
  rust:
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    # The image release.yml packages on. macos-14, which this replaces, is retired on
    # 2026-11-02 and fails during October's brownouts — and the context this job feeds is
    # required, so that failure is every merge rather than this job alone.
    runs-on: macos-26
    permissions:
      contents: read
    # No debug info. Nothing here debugs: the tests report by assertion message, and a
    # backtrace would be read from the source anyway. Measured on the first warm run
    # before this: the cargo work was 13.65 s against 11.7 s spent restoring a 415 MB
    # cache, so the artifacts' size had become the larger half of the job — and that
    # cache shares a 10 GB repository budget with the two release caches (399 / 474 MB),
    # where eviction is what turns a warm run back into a cold one.
    #
    # Job level rather than on the cargo step: rust-cache runs earlier and folds CARGO_*
    # variables into its key, so setting it on the step would leave the key describing a
    # build the cache no longer holds. Both profiles are needed — `cargo test` builds the
    # tested crate under `test` and its dependencies under `dev`, and the dependencies
    # are the 298 crates.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    # Unmeasured for this shape (debug profile, tests). The only figure that exists is the
    # 5.1-minute cold RELEASE build post-merge.yml records, so this takes that bound with
    # the same headroom rather than inventing a budget of its own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Its own key: the release cache holds a different profile's artifacts, and
          # sharing it would have each eviction take the other's warm build with it.
          shared-key: test
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10 # hang detector, not a budget — see .github/actions/install-browsers
      # tauri-build reads the frontend output and copies bundle.resources at compile time,
      # so both have to exist before cargo runs. This job never bundles, so the notice is
      # a placeholder rather than the generated one (same as post-merge.yml's warm build).
      - run: pnpm build
      - run: echo "" > src-tauri/THIRD_PARTY_LICENSES.html
      - run: cargo test
        working-directory: src-tauri

  # The ordinary E2E suite (--project=chromium). It is cheap enough on a two-worker runner
  # that the alternative — a net firing only once the change is already on main — costs more
  # than it saves. What it costs, and what the harness costs beside it, is measured once in
  # docs/{en,ja}/live-race-harness.md ("Where each tier runs") and stated nowhere else: the
  # copy that used to sit in this comment went stale without anyone noticing, which is the
  # whole reason for the rule. The race harness is deliberately NOT here; see race.yml.
  e2e:
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov's tokenless upload exchanges GitHub's OIDC token. Job permissions do
      # not inherit from frontend, so the container job needs its own grant.
      id-token: write
    # The browsers and their system libraries come from the image rather than from the
    # runner's Ubuntu mirror. Pulling the image costs about what `--with-deps chromium`
    # costs on a good day — so the change is free in time and takes a whole run of
    # sequential .deb fetches out of every pull request. The measurements behind that,
    # dated, are in .github/actions/install-browsers and are not restated here.
    container: mcr.microsoft.com/playwright:v${{ needs.preflight.outputs.version }}-noble
    timeout-minutes: 15
    # Split across runners rather than across workers on one. Playwright's default takes
    # half the runner's cores, so raising `workers` is the cheaper-looking move — and it
    # raises the CPU pressure every case runs under, which is the one variable this
    # suite's load-dependent failures are known to follow (reference/work/e2e-flakes.md).
    # Shards keep the same two workers apiece and add machines instead.
    #
    # Three because the per-job floor stops paying: container pull, checkout, install and
    # the two vite builds are a fixed cost per shard, and past three the split buys less
    # than that floor costs. The tier's own cost, and the fact that its equal-count split
    # divides evenly where the harness's does not, belong to
    # docs/{en,ja}/live-race-harness.md ("Where each tier runs") and are not restated here.
    strategy:
      # A red shard must not cancel the others: the point of splitting is that one run
      # still reports on the whole suite, and a cancelled shard is a verdict nobody has —
      # `ci-required` reads it as a failure with no test behind it.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10 # hang detector, not a budget — see .github/actions/install-browsers
      # Already in the image; kept as the self-healing no-op described in the action.
      - uses: ./.github/actions/install-browsers
        with:
          browser: chromium
          with-deps: "false"
      # No `--` before the flag: pnpm 10 consumes it rather than forwarding it, and
      # Playwright then reads what follows as a file filter — every shard runs the whole
      # suite AND passes, so nothing says the split stopped working. The count comes from
      # `strategy.job-total` so the matrix list above is the only place it is written.
      - run: pnpm test:e2e:coverage --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # A separate flag keeps the two test tiers inspectable; Codecov merges both
      # uploads for the commit, so a line reached by either unit or E2E is covered. The
      # shards upload under that same flag and are merged the same way — a line one shard
      # never reached is covered by whichever one did. Only `name` separates them, so a
      # shard that uploaded nothing is still visible as itself.
      - name: Upload frontend E2E coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          fail_ci_if_error: false
          files: ./coverage/e2e/lcov.info
          flags: e2e
          name: frontend-e2e-${{ matrix.shard }}
          use_oidc: true
      # The "list" reporter writes no playwright-report/; traces (trace: on-first-retry,
      # with CI retries) and failure attachments land in the default test-results/, so
      # that is what a failing run has to upload. One name per shard: upload-artifact
      # rejects a name another job already claimed, so a shared one would fail the upload
      # in whichever shard lost the race — on a run that is already red.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The single context this workflow contributes to the branch ruleset (.github/required-checks.json).
  # It reports on every pull request, including a doc-only one where everything above it
  # skipped — which is the point: a required check that does not report cannot be waited
  # for, it can only block forever.
  #
  # `always()` and an explicit read of the results, rather than a bare `needs:`, because a
  # job skipped by a failed dependency reports SUCCESS to a required check. With `needs:`
  # alone this gate would be skipped by that same rule and the ruleset would read the red
  # run as green.
  ci-required:
    # `e2e` is one entry here whatever the matrix does: a matrix job's result is the
    # aggregate, failure if any shard failed, so the gate needs no per-shard knowledge and
    # a fourth shard does not have to be remembered here.
    needs: [preflight, frontend, rust, e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed or skipped by design
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        # Named one by one rather than joined: `needs.*.result` is a bare list of results
        # whose order is not this file's to promise, and a message that pairs the wrong
        # job with the wrong verdict sends the reader to the wrong log.
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "::error::CI did not pass — preflight=${PREFLIGHT} frontend=${FRONTEND} rust=${RUST} e2e=${E2E}"
          exit 1
