name: Dependabot auto-merge

# Decides whether a Dependabot pull request merges on its own. For a Dependabot pull
# request in which every updated dependency is a semver patch or a semver minor update, or a
# git submodule (vendor/urx-lcd-sim, whose update is a commit and carries no version), it
# enables auto-merge (merge commit) pinned to the head commit it read, so a run for an older
# head cannot enable it for a newer one. A minor update of a cargo crate below 1.0 does not
# count: Cargo treats a 0.x minor as incompatible, while Dependabot labels it semver-minor.
# The exception is cargo's alone; a minor update of an npm package below 1.0 (esbuild) counts.
# It enables auto-merge only when the pull request is one commit, that commit is the head the
# event names, dependabot[bot] wrote it, GitHub (web-flow) committed it and GitHub verified its
# signature: fetch-metadata reads the first commit alone, and an amend keeps the author while it
# makes the amending person the committer. For anything else — a major update, an update with no version (a
# commit SHA) outside a submodule, one fetch-metadata cannot read, a run in which fetch-metadata fails, and any other
# commit history — it turns off an auto-merge an earlier head enabled: a push leaves auto-merge
# on, and a rebase or an added commit can change what the update is. On every other pull request
# both steps are skipped.
# A run whose head is no longer the head of the pull request changes nothing. The step fails
# when it cannot read the commits of the pull request, its head or whether auto-merge is on.
#
# It reads each dependency in fetch-metadata's `updated-dependencies-json` rather than the
# summary outputs: `update-type` is the highest type among the dependencies that have one,
# so a dependency with none does not lower it, and `previous-version` is the first
# dependency's alone.
#
# The job reports `auto-merge`, one of the contexts .github/required-checks.json makes a
# merge condition, so a pull request does not merge before the run for its head commit has
# decided. The Dependabot condition therefore sits on the steps and not on the job: the job
# runs, and reports, on every pull request. No trigger filter, for the reason format.yml
# carries. The runs for one pull request share a concurrency group, keyed the way
# scripts/check-merge-gates.mjs accepts for a required context, so they run one at a time; a
# run still waiting when a newer one arrives is cancelled, and the newer one reports for the head.
#
# A merge made by auto-merge is attributed to GITHUB_TOKEN, so the push it makes to main
# starts no workflow; docs/{en,ja}/architecture.md says what that leaves unrun.
on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number || github.run_id }}
    steps:
      - id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        continue-on-error: true # the deciding step keeps auto-merge off and the check passes (dependabot-auto-merge.test.mjs:258)
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for a patch, minor or submodule update Dependabot alone wrote, disable it otherwise
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          UPDATED: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          eligible=false
          if [ "$METADATA_OUTCOME" != 'success' ]; then
            echo "::warning::fetch-metadata did not classify this pull request (${METADATA_OUTCOME}), so auto-merge stays off"
          else
            eligible=$(printf '%s' "$UPDATED" | jq -r '
              length > 0 and all(.[];
                .packageEcosystem == "submodules"
                or .updateType == "version-update:semver-patch"
                or (.updateType == "version-update:semver-minor"
                  and (.packageEcosystem // "") != ""
                  and (.packageEcosystem != "cargo" or ((.prevVersion // "") | test("^[1-9][0-9]*\\.")))))')
          fi
          if [ "$eligible" = 'true' ]; then
            commits=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100")
            eligible=$(printf '%s' "$commits" | jq -r --arg head "$HEAD_SHA" '
              length == 1 and .[0].sha == $head
              and .[0].author.login == "dependabot[bot]"
              and .[0].committer.login == "web-flow"
              and .[0].commit.verification.verified == true')
          fi
          if [ "$eligible" = 'true' ]; then
            gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
          else
            state=$(gh pr view "$PR_URL" --json headRefOid,autoMergeRequest --jq '[.headRefOid, (.autoMergeRequest != null)] | @tsv')
            read -r current enabled <<< "$state"
            if ! [[ "$current" =~ ^[0-9a-f]{40}$ ]] || { [ "$enabled" != 'true' ] && [ "$enabled" != 'false' ]; }; then
              echo "::error::could not read the head of the pull request and whether auto-merge is enabled: '$state'"
              exit 1
            fi
            if [ "$current" != "$HEAD_SHA" ]; then
              echo "::notice::the head of the pull request is now ${current}, so the run for that head decides"
            elif [ "$enabled" = 'true' ]; then
              gh pr merge --disable-auto "$PR_URL"
            fi
          fi
