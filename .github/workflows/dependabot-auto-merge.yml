name: Dependabot auto-merge

# Decides whether a Dependabot pull request merges on its own. For a Dependabot pull
# request whose update is a semver patch, it enables auto-merge (merge commit) pinned to the
# head commit it read, so a run for an older head cannot enable it for a newer one. For any
# other update type, including one fetch-metadata cannot read, it turns off an auto-merge an
# earlier head enabled: a push from Dependabot leaves auto-merge on, and a rebase can turn a
# patch into a minor or major update. On every other pull request both steps are skipped.
#
# The job reports `auto-merge`, one of the contexts .github/required-checks.json makes a
# merge condition, so a pull request does not merge before the run for its head commit has
# decided. The Dependabot condition therefore sits on the steps and not on the job: the job
# runs, and reports, on every pull request. No trigger filter, for the reason format.yml
# carries; no concurrency group, so no run reporting `auto-merge` is cancelled.
#
# A merge made by auto-merge is attributed to GITHUB_TOKEN, so the push it makes to main
# starts no workflow; docs/{en,ja}/architecture.md says what that leaves unrun.
on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for a patch update, disable it otherwise
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [ "$UPDATE_TYPE" = 'version-update:semver-patch' ]; then
            gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
          elif [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = 'true' ]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
