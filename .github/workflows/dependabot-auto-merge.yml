name: Dependabot auto-merge

# Decides whether a Dependabot pull request merges on its own. For a Dependabot pull
# request in which every updated dependency is a semver patch or a semver minor update, it
# enables auto-merge (merge commit) pinned to the head commit it read, so a run for an older
# head cannot enable it for a newer one. A minor update of a cargo crate below 1.0 does not
# count: Cargo treats a 0.x minor as incompatible, while Dependabot labels it semver-minor.
# The exception is cargo's alone; a minor update of an npm package below 1.0 (esbuild) counts.
# For anything else — a major update, an update with no version (a commit SHA), and one
# fetch-metadata cannot read — it turns off an auto-merge an earlier head enabled: a push
# from Dependabot leaves auto-merge on, and a rebase can change what the update is. On every
# other pull request both steps are skipped. The step fails when it cannot read whether
# auto-merge is on.
#
# It reads each dependency in fetch-metadata's `updated-dependencies-json` rather than the
# summary outputs: `update-type` is the highest type among the dependencies that have one,
# so a dependency with none does not lower it, and `previous-version` is the first
# dependency's alone.
#
# The job reports `auto-merge`, one of the contexts .github/required-checks.json makes a
# merge condition, so a pull request does not merge before the run for its head commit has
# decided. The Dependabot condition therefore sits on the steps and not on the job: the job
# runs, and reports, on every pull request. No trigger filter, for the reason format.yml
# carries; no concurrency group, so no run reporting `auto-merge` is cancelled.
#
# A merge made by auto-merge is attributed to GITHUB_TOKEN, so the push it makes to main
# starts no workflow; docs/{en,ja}/architecture.md says what that leaves unrun.
on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for a patch or minor update, disable it otherwise
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATED: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          eligible=$(printf '%s' "$UPDATED" | jq -r '
            length > 0 and all(.[];
              .updateType == "version-update:semver-patch"
              or (.updateType == "version-update:semver-minor"
                and (.packageEcosystem // "") != ""
                and (.packageEcosystem != "cargo" or ((.prevVersion // "") | test("^[1-9][0-9]*\\.")))))')
          if [ "$eligible" = 'true' ]; then
            gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
          else
            enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [ "$enabled" = 'true' ]; then
              gh pr merge --disable-auto "$PR_URL"
            elif [ "$enabled" != 'false' ]; then
              echo "::error::could not read whether auto-merge is enabled: '$enabled'"
              exit 1
            fi
          fi
