name: Release

# Builds desktop installers (macOS .dmg/.app, Windows .exe NSIS setup) with
# tauri-action and attaches them to a draft GitHub Release. A vX.Y.Z tag cuts a
# release; the draft is left for manual review before publishing.
#
# The tag normally arrives from tag-release.yml, which dispatches this workflow ON THE
# TAG rather than pushing it into a `push:` trigger — a tag pushed with the repository's
# GITHUB_TOKEN starts no workflow at all, and workflow_dispatch is the documented
# exception. So what decides a release here is the REF TYPE, not the event: a dispatch
# on a tag is a release exactly like a tag push, and a dispatch on a branch stays what
# it always was — a packaging check that builds the bundles as job artifacts and
# creates nothing.
#
# No E2E runs here. The harness runs on the pull requests race.yml's trigger names, the
# version bump among them, so it sits in front of the tag rather than behind it.
# What a release tag looks like is decided in scripts/release-tag-shape.sh, which check-tag
# below runs and tag-release.yml runs before it pushes one. The globs here are the one copy
# that cannot be folded in there, since a trigger filter cannot run a script; they track it
# as closely as GitHub's filter glob can, which has no alternation, so the three prerelease
# prefixes are three lines. Where the two still disagree — the glob cannot express the
# script's trailing `*([0-9.])`, so `v1.0.0-alphafoo` reaches the job — the run goes RED on
# `check-tag` and creates nothing. A tag OUTSIDE the glob starts no run at all, which is the
# quiet half and the reason to keep the two lists close rather than to widen this one.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha*'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*'
  workflow_dispatch:

# Keyed by the ref, which for both triggers is the tag: a re-dispatch of a tag already
# building queues instead of running beside it, so two runs cannot assemble the same draft
# Release at once. `cancel-in-progress` stays false — the installers are what this
# produces, and a build killed part-way leaves a draft holding some platforms and not
# others.
#
# `queue: max` is the other half of that, and without it the promise above holds for one
# run only: `concurrency.queue` defaults to `single`, which keeps at most ONE run pending
# and cancels it when the next arrives, so a third dispatch on one tag would drop the
# queued second — a run that produces nothing and shows grey. `max` raises the ceiling to
# 100 and runs them in arrival order. It cannot be combined with `cancel-in-progress: true`,
# which is why only the two workflows that do not cancel can carry it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      validTag: ${{ steps.check.outputs.validTag }}
    steps:
      # For scripts/release-tag-shape.sh, which the step below asks. Checked out at this
      # run's own ref, so a tag is judged by the copy the tagged commit carries.
      #
      # Skipped on a branch, because the step below returns before it reads the script
      # there — and because this job is the one path that must not fail on a dispatch that
      # only packages. A checkout can fail on a bad day, and a failed check-tag is a
      # condition `release-gate` is built to report, so an unconditional one would let a
      # transient network error annotate a branch run with "was tagged but no complete
      # draft Release exists".
      - if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        # A tag ref that script declines FAILS this job, which takes create-release and
        # build out with it and turns the run red — `release-gate` is the one job that
        # still runs, deliberately, and it is what reports the failure. What this replaces
        # is a green run that packaged into job artifacts and created no Release — a tag
        # that looks released until someone opens the Releases page.
        #
        # Gated on the REF TYPE, not the event: tag-release.yml reaches this workflow by
        # dispatching it on the tag it just created, and that has to mean the same thing
        # as a tag push. A dispatch on a BRANCH has no tag to read, stays false and stays
        # SUCCESSFUL — that is the packaging check, and it is the one path this job must
        # not fail.
        #
        # The script's two streams are kept apart: stdout is the answer, stderr is the
        # message. Merging them would make anything the shell itself writes — a locale
        # warning is the ordinary one — into the `prerelease` value written below, and
        # `create-release` compares that value to the string `true`, so a polluted one
        # publishes a prerelease as a normal Release. That draft is what `latest` resolves
        # to, and the updater endpoint in src-tauri/tauri.conf.json points at `latest`.
        #
        # Status 1 is a verdict on the tag. Anything else — the script missing, not
        # readable, killed, or answering something that is neither `true` nor `false` — is
        # this check being broken, and says so instead of blaming the tag.
        run: |
          if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            echo 'validTag=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          why=$(mktemp)
          shape=$(bash scripts/release-tag-shape.sh "${GITHUB_REF_NAME}" 2>"${why}") && status=0 || status=$?
          message=$(tr '\n' ' ' < "${why}")
          if (( status == 1 )); then
            echo "::error::${message}"
            exit 1
          fi
          if (( status != 0 )) || [[ "${shape}" != 'true' && "${shape}" != 'false' ]]; then
            echo "::error::the release tag shape check could not run: exit ${status}, answered '${shape//$'\n'/ }' ${message}"
            exit 1
          fi
          {
            echo 'validTag=true'
            echo "prerelease=${shape}"
            echo "version=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"

  # `licenses` as well as the tag check, so a notice that cannot be generated stops the
  # draft from existing rather than leaving an empty one behind.
  #
  # `build` already refuses to run without it (`needs.licenses.result == 'success'` below),
  # but a job skipped by `if:` reports SUCCESS, so that refusal is silent — and nothing
  # waits on this workflow's conclusion. What the operator would find is a draft Release
  # holding no .dmg, no NSIS setup and no latest.json, and publishing a draft is what fires
  # pages.yml, so the demo would go live against a release with no binaries. Depending on
  # it here means the draft is never created: a `needs:` failure skips this job, and a tag
  # with no release is a state someone re-runs rather than one they publish.
  #
  # The `if:` below carries NO status check function, and that is what makes the sentence
  # above true: without one GitHub applies an implicit `success()`, so a `needs:` job that
  # failed, was cancelled or was skipped all take this job out. Writing `always() &&` or
  # `!cancelled() &&` in front of it — which reads like the neighbouring `build` and would
  # look like a tidy-up — restores the empty draft.
  create-release:
    needs: [check-tag, licenses]
    if: needs.check-tag.outputs.validTag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releaseId: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ needs.check-tag.outputs.version }}
          PRERELEASE: ${{ needs.check-tag.outputs.prerelease }}
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              name: process.env.TAG,
              draft: true,
              prerelease: process.env.PRERELEASE === 'true',
              generate_release_notes: true,
            })
            return data.id

  # bundle.resources, generated once here instead of on every runner.
  licenses:
    uses: ./.github/workflows/licenses.yml

  build:
    needs: [check-tag, create-release, licenses]
    # Runs when create-release SUCCEEDED (a tag with a draft to upload to) or was SKIPPED
    # (a manual dispatch, which packages into job artifacts instead — the other way
    # create-release used to be skipped, a tag ref check-tag declines, now fails check-tag
    # and takes this job out with it). It does not run when create-release FAILED: there
    # would be no
    # draft to upload to, so this job would sign and notarize both installers and keep
    # neither, and report success doing it.
    #
    # `!cancelled()` rather than `always()`: both override the implicit success() that
    # would otherwise skip this job whenever create-release is skipped, and `!cancelled()`
    # additionally leaves the job out when the whole run is cancelled, where what
    # `needs.create-release.result` reads as is not something this file wants to depend on.
    # The notice is a bundle input, so its job has to have succeeded either way.
    if: >-
      !cancelled() && needs.check-tag.result == 'success' && needs.licenses.result == 'success'
      && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin
          - platform: windows-latest
            args: ''
            rustTargets: ''
    runs-on: ${{ matrix.platform }}
    # The most generous bound in the repository, and deliberately so: this job signs,
    # notarizes and packages, its Rust cache can be cold, and a false timeout here fails
    # a RELEASE. 12.8 minutes is the slowest of fourteen recent runs. It is a hang
    # detector, not a budget — what it replaces is GitHub's six-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # SHA pin drops the branch-name toolchain shorthand, so the channel is
      # passed explicitly. No version tags; Dependabot leaves this pin alone.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rustTargets }}
      # shared-key, not the default job-derived one: post-merge.yml's warm-cache
      # job fills this cache on main, which is the only scope a tag run can
      # restore from — its matrix and this key have to stay identical, since a
      # mismatch only shows up as a slow release. Read-only for the same reason:
      # a cache saved here lands in the tag's own scope, where nothing reads it.
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: false
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10 # hang detector, not a budget — see .github/actions/install-browsers
      # bundle.resources; generated once by the licenses job above.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses
          path: src-tauri
      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). Required for auto-update: tauri-action
          # signs the bundles and emits latest.json only when these are set.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing + notarization. All optional: with the secrets unset
          # tauri-action ships an unsigned bundle (Gatekeeper warning on launch).
          APPLE_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERT }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        with:
          # Empty on a manual run, so tauri-action builds without uploading.
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          args: ${{ matrix.args }}
      # The one reading that says the link argument in src-tauri/.cargo/config.toml reached
      # the binary this run is shipping. It is checked here rather than at build time because
      # a RUSTFLAGS in the environment REPLACES that table rather than adding to it, and a
      # dropped argument has no other symptom: the build succeeds and the window quietly wears
      # the system's title bar again. Reads the packaged binary, so signing and notarization
      # have already happened — neither touches a load command, and there is nothing earlier
      # in this job that the argument could be read off.
      - name: Verify the recorded macOS platform version
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: node scripts/check-macho-platform.mjs "src-tauri/target/${{ matrix.rustTargets }}/release/bundle/macos/URX Router.app/Contents/MacOS/urx-router"
      # On a manual dispatch there is no release to attach to, so surface the
      # bundles as downloadable job artifacts instead.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.check-tag.outputs.validTag != 'true'
        with:
          name: urx-router-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: error

  # The run's own verdict, said in terms of the tag. Nothing waits on this workflow's
  # conclusion — tag-release.yml dispatches it and ends — and a tag whose release failed
  # leaves no trace on the Releases page, which is the one page the operator is required to
  # visit (publishing the draft is what fires pages.yml). Without this job the only surface
  # is a red run whose job names say "create-release" and "build" rather than which tag has
  # no installers.
  #
  # Scoped to a tag run: on a dispatch that packages into artifacts there is no release to
  # be missing. `always()` so it reports on a cancelled run too, which is a run that
  # produced no draft like any other.
  release-gate:
    needs: [check-tag, create-release, licenses, build]
    # A check-tag that did not succeed writes no outputs, so `validTag` is empty and the tag
    # half of this condition cannot carry it. Without the result clause the one failure
    # class this workflow reports on a tag — a ref check-tag declines — would skip this job,
    # and a job skipped by `if:` reports success.
    #
    # `!= 'success'` rather than `== 'failure'` so a CANCELLED check-tag lands here too: a
    # cancelled job's result is neither, and it would otherwise leave a run that pushed a
    # tag and built nothing with no red face anywhere. A branch dispatch is untouched —
    # check-tag succeeds there with validTag false, so both halves stay false and this job
    # is skipped, which is what keeps the packaging check quiet.
    if: >-
      always() && (needs.check-tag.result != 'success'
      || needs.check-tag.outputs.validTag == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless the tag produced a draft with installers
        if: >-
          needs.check-tag.result != 'success' || needs.create-release.result != 'success'
          || needs.build.result != 'success'
        env:
          CHECK: ${{ needs.check-tag.result }}
          LICENSES: ${{ needs.licenses.result }}
          CREATE: ${{ needs.create-release.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "::error::${GITHUB_REF_NAME} was tagged but no complete draft Release exists"
          echo "::error::check-tag=${CHECK} licenses=${LICENSES} create-release=${CREATE} build=${BUILD}"
          exit 1
