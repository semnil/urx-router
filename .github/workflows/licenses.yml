name: Licenses

# Generates the third-party license notice bundled as an app resource
# (bundle.resources) and publishes it as the `third-party-licenses` artifact.
# Called by post-merge.yml (license drift gate on main) and by release.yml,
# whose platform builds consume the artifact. Generating it once is safe
# because the output is host-independent: about.toml declares no `targets`, so
# cargo-about keeps every target's crates whatever the runner is.
on:
  workflow_call:

permissions:
  contents: read

# `github.run_id` inside a called workflow is the CALLER's run id, so each invocation is
# a group of one. That is the point: post-merge.yml and release.yml both call this, and a
# group they shared would let a merge landing during a release build cancel the very
# artifact that build consumes (`if-no-files-found: error` on the upload below is the
# other half of that path).
concurrency:
  group: licenses-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA pin drops the branch-name toolchain shorthand, so the channel is
      # passed explicitly. No version tags; Dependabot leaves this pin alone.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      # cargo-about gates its CLI binary behind the non-default `cli` feature, so a
      # prebuilt-less install (install-action's source-build fallback) yields no
      # `cargo-about` binary. Build from source with the feature, cached by version.
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-about@0.9.1
          features: cli
      # Fails if a dependency carries a license not in about.toml's accepted
      # list, so a new crate can't silently drop a required notice.
      - run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html
        working-directory: src-tauri
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: src-tauri/THIRD_PARTY_LICENSES.html
          if-no-files-found: error
          retention-days: 30
